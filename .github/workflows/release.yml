name: Release to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no API token required.
# The pending publisher on PyPI is bound to:
#   project: crawldata-engine · owner: FindDataTechnology ·
#   repository: crawldata-engine · workflow: release.yml · environment: pypi
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC token for trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crawldata-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
